name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'This version is already tagged. Bump Cargo.toml before releasing.' >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang libclang-dev cmake pkg-config curl zstd \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxcb1-dev

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: '1.95.0'
          cache: false
          rustflags: ''

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: release-ubuntu24-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build and package Linux archive
        run: |
          cargo build --locked --release --bin marcterm
          output="$RUNNER_TEMP/marcterm-release"
          package="$output/marcterm"
          install -Dm755 target/release/marcterm "$package/bin/marcterm"
          install -Dm644 flatpak/io.marc.term.desktop "$package/share/applications/io.marc.term.desktop"
          install -Dm644 flatpak/io.marc.term.metainfo.xml "$package/share/metainfo/io.marc.term.metainfo.xml"
          install -Dm644 icon.png "$package/share/icons/hicolor/128x128/apps/io.marc.term.png"
          install -Dm644 LICENSE.md "$package/share/licenses/marcterm/LICENSE.md"
          find target/release/build -name LICENSE_SKIA -exec cp '{}' "$package/share/licenses/marcterm/" \;
          cd "$output"
          archive="marcterm-$RELEASE_TAG-x86_64-linux.tar.zst"
          tar --create --use-compress-program='zstd --quiet -T2 -10' --file "$archive" marcterm
          if (( $(stat -c %s "$archive") >= 2147483648 )); then
            echo "Release archive exceeds GitHub's asset limit." >&2
            exit 1
          fi
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish to crates.io (dry run)
        uses: marc2332/letmerelease@58a745fdeb93e184bd8cfe3b04a67565c0c8662f
        with:
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          dry-run: true

      - name: Publish to crates.io
        uses: marc2332/letmerelease@58a745fdeb93e184bd8cfe3b04a67565c0c8662f
        with:
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/marcterm-release/marcterm-$RELEASE_TAG-x86_64-linux.tar.zst"
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
