[package]
name = "marcterm"
edition = "2024"
publish = true
description = "my terminal as you might have guessed by the name"
version = "0.4.5"
license = "MIT"
repository = "https://github.com/marc2332/marcterm"

[[bin]]
name = "marcterm"
path = "src/main.rs"

[dependencies]
freya = { git = "https://github.com/marc2332/freya", branch = "fix/dont-close-terminal-on-read-errors", features = [
  "terminal",
  "radio",
  "material-design",
  "icons-lucide",
  "router",
] }
freya-performance-plugin = { git = "https://github.com/marc2332/freya", branch = "fix/dont-close-terminal-on-read-errors" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
futures = "0.3"
async-io = "2"
open = "5"
rfd = "0.17"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
xcursor = "0.3"
