[package]
name = "marcterm"
edition = "2024"
publish = true
description = "my terminal as you might have guessed by the name"
version = "0.6.3"
license = "MIT"
repository = "https://github.com/marc2332/marcterm"

[package.metadata.deb]
maintainer = "Marc Espin <marc@mespin.me>"
license-file = ["LICENSE.md", "0"]
extended-description = "Terminal emulator built with Freya and Rust. Supports tabs, split panels, Git worktrees and persistent sessions."
depends = "$auto, libvulkan1, libwayland-client0, libx11-6, libxcursor1, libxkbcommon0, xdg-utils"
suggests = "gh"
section = "x11"
priority = "optional"
assets = [
  [
    "target/release/marcterm",
    "usr/bin/marcterm",
    "755",
  ],
  [
    "packaging/io.marc.term.desktop",
    "usr/share/applications/io.marc.term.desktop",
    "644",
  ],
  [
    "packaging/io.marc.term.metainfo.xml",
    "usr/share/metainfo/io.marc.term.metainfo.xml",
    "644",
  ],
  [
    "icon.png",
    "usr/share/icons/hicolor/128x128/apps/io.marc.term.png",
    "644",
  ],
  [
    "target/release/build/freya-skia-bindings-*/out/skia/LICENSE_SKIA",
    "usr/share/doc/marcterm/",
    "644",
  ],
]

[[bin]]
name = "marcterm"
path = "src/main.rs"

[dependencies]
freya = { version = "0.5.0-rc.13", features = [
  "terminal-pty",
  "radio",
  "material-design",
  "icons-lucide",
  "router",
  "borderless",
] }
freya-metrics-plugin = "0.5.0-rc.13"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
futures = "0.3"
blocking = "1"
async-io = "2"
open = "5"
rfd = "0.17"
libc = "0.2"
gix = { version = "0.87", default-features = false, features = [
  "status",
  "max-performance-safe",
  "sha1",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
